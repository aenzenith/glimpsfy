[package]
name = "glimpsfy-history"
description = "The capture history of Glimpsfy: entries, queries, search, deletion and retention"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
glimpsfy-upload.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
png.workspace = true
# The bundled SQLite is built with FTS5, so search does not depend on the system's SQLite.
rusqlite = { version = "0.39", features = ["bundled", "functions", "collation"] }
# NFKD decomposition for the search folding (`fold.rs`).
unicode-normalization = "0.1.24"
# Thumbnails of opaque captures are JPEG: a quarter of the PNG's size at the same look.
jpeg-encoder = "0.6.1"

# Moving a user's file to the Trash goes through NSFileManager, which needs no Finder automation
# permission.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

# The Recycle Bin is filled through the shell's IFileOperation with a sink of our own, which
# refuses a delete that would not recycle (`trash.rs`); `windows-core` is named because
# `#[implement]` expands to paths in it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62.2"

# The freedesktop.org Trash: the home trash, or the trash folder of the file's own mount. `jiff`
# writes the deletion date that the specification asks for into the `.trashinfo`.
[target.'cfg(target_os = "linux")'.dependencies]
trash = { version = "5.4.0", default-features = false, features = ["freedesktop", "jiff"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
