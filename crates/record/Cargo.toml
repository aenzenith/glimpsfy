[package]
name = "glimpsfy-record"
description = "Screen recording for Glimpsfy: the recorder's states, the take's timeline and audio, the MP4 writer and MP4 and GIF export"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
glimpsfy-capture.workspace = true
serde.workspace = true
thiserror.workspace = true
# GIF export (MIT or Apache-2.0); its NeuQuant comes from `color_quant` (MIT). `gifski` and
# `imagequant` are AGPL/GPL and cannot be linked into this MIT app.
gif = { version = "0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
color_quant = "2.0.0"
# Free disk space (`statfs`) and the no-replace rename (`renamex_np`).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL", "NSValue", "NSRunLoop", "NSDate"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime", "CMTimeRange", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn", "objc2-core-graphics"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-media", "objc2-core-video", "objc2-core-audio-types", "objc2-core-foundation", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetWriter", "AVAssetWriterInput", "AVMetadataItem", "AVMetadataIdentifiers", "AVMediaSelectionGroup", "AVCaptureAudioDataOutput", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVMediaFormat", "AVVideoSettings"] }

# The Recycle Bin and the freedesktop.org Trash are the history's (`glimpsfy_history::SystemTrash`),
# so the rule that an untrashable file is never unlinked lives in one place.
[target.'cfg(not(target_os = "macos"))'.dependencies]
glimpsfy-history.workspace = true

# Media Foundation writes and reads the MP4, Core Audio lists the microphones, and the registry
# holds the privacy switches. The Media Foundation entry points are looked up at run time
# (`platform/windows/mf.rs`), so an N edition without the Media Feature Pack still starts.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

# The writer, the reader and the export on Linux run on the system's GStreamer (1.20 on Ubuntu
# 22.04), linked dynamically, with the same release line as the capture crate's stream so one
# copy is linked. The 0.25 line needs Rust 1.92; 0.24 builds with 1.83.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gstreamer-video = "0.24.5"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
