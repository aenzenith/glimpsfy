[package]
name = "glimpsfy-ocr"
description = "Text recognition and code detection for Glimpsfy behind one engine trait: Vision, Windows.Media.Ocr and PP-OCR"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Lists the PP-OCR engine and builds its inference (`src/engines/ppocr`). The app turns it on for
# Linux and Windows; macOS ships with Vision and stays without it. The model management in
# `src/models` works without the feature.
ppocr = ["dep:rten", "dep:rten-tensor"]

[dependencies]
glimpsfy-capture.workspace = true
serde.workspace = true
thiserror.workspace = true
png.workspace = true
# The model download, the only network traffic this crate may cause, is `glimpsfy-models`'.
glimpsfy-models.workspace = true
# The rules of `src/entities/rules.rs`: links, email addresses, phone numbers and dates on every
# platform. regex-lite has no Unicode tables, so a letter outside ASCII is checked in the rules.
regex-lite = "0.1.9"
# A found date's start and end, in the system's local time without a zone (`src/entities`).
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# RTen runs the PP-OCR models (`src/engines/ppocr/runtime.rs`): an ONNX runtime in Rust, MIT or
# Apache-2.0, built from source with no native library and no build-time download. Its default
# features add ONNX Runtime's contrib operators, which the models do not use.
rten = { version = "0.28", optional = true, default-features = false, features = ["onnx_format"] }
rten-tensor = { version = "0.28", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSString", "NSError", "NSIndexSet", "NSDictionary", "NSData", "NSRange", "NSValue", "NSObject", "NSEnumerator", "block2", "NSRegularExpression", "NSTextCheckingResult", "NSDate", "NSURL"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes", "CFData", "CFDictionary", "CFString", "CFURL"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGImage", "CGColorSpace", "CGDataProvider", "CGContext", "CGBitmapContext", "CGGeometry"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }
# `VNGenerateForegroundInstanceMaskRequest` (macOS 14) finds the subjects that Remove background
# lifts (`src/subjects.rs`); its masks arrive as CoreVideo pixel buffers.
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-video", "VNRequest", "VNRecognizeTextRequest", "VNDetectBarcodesRequest", "VNGenerateForegroundInstanceMaskRequest", "VNObservation", "VNRequestHandler", "VNTypes", "VNGeometry"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-natural-language = { version = "0.3.2", default-features = false, features = ["std", "NLLanguage", "NLLanguageRecognizer"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows.Media.Ocr (`src/engines/windows.rs`). The versions are the ones Tauri already links.
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "System_UserProfile", "Win32_System_Com", "Win32_System_WinRT"] }
windows-future = "0.3.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# QR codes and barcodes where Vision does not exist (`src/barcodes.rs`): a ZXing port in Rust,
# Apache-2.0. Only the decoders are built; image loading, SVG, the encoders and rayon stay out.
rxing = { version = "0.9.4", default-features = false, features = ["decoders", "multi_barcode_readers", "encoding_rs", "qrcode", "aztec", "datamatrix", "pdf417", "oned"] }
# `load_image` outside macOS (`src/image.rs`), beside `png`. zune-jpeg is MIT, Apache-2.0 or
# Zlib and already in the tree through Tauri's `image`; image-webp is the capture crate's.
zune-jpeg = "0.5.15"
image-webp = "0.2.4"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
