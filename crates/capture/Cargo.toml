[package]
name = "glimpsfy-capture"
description = "Displays, windows and frames: the capture contract of Glimpsfy and its platform backends"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
png.workspace = true
# Encoders for Settings › Output › Format, in pure Rust. jpeg-encoder's licence adds the IJG
# notice, which About's acknowledgements must carry.
jpeg-encoder = "0.6.1"
# Lossless (VP8L) only: no pure-Rust lossy WebP encoder exists, so WebP ignores the quality.
image-webp = "0.2.4"
# Saved PNGs compressed again without changing a pixel (`encode::optimise_png`). It brings
# libdeflate, the crate's one C library, which `cc` compiles with the platform's C compiler.
oxipng.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
# NSColor, NSColorSpace and NSAppearance read the system's window colour, which fills a window
# capture's translucent parts.
objc2-app-kit = { workspace = true, features = ["std", "NSScreen", "NSGraphics", "NSApplication", "objc2-core-foundation", "NSColor", "NSColorSpace", "NSAppearance", "NSResponder", "block2"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSString", "NSValue", "NSError", "NSObject", "NSNotification", "NSOperation", "block2"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFData", "CFDictionary", "CFString", "CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGColorSpace", "CGDataProvider", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGGeometry", "CGImage", "CGWindow", "CGBitmapContext", "CGContext", "CGToneMapping", "bitflags", "libc"] }
# `dlsym` for the tone mapping functions of macOS 15 (`platform/macos_hdr.rs`), so the app still
# starts on macOS 14.
libc = "0.2"
objc2-screen-capture-kit = { workspace = true, features = ["std", "SCScreenshotManager", "SCShareableContent", "SCStream", "SCError", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
# The recording stream (`stream.rs`, `platform/macos_stream.rs`, screen recording): sample
# buffers, pixel buffers and the microphone through AVCaptureSession on macOS 14.
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTime", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2-core-graphics"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-audio-types", "AVCaptureAudioDataOutput", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVMediaFormat"] }

# The same `windows` release Tauri's tao and wry use, so one copy is linked. GDI takes the stills,
# Windows.Graphics.Capture on Direct3D 11 takes windows and streams, WASAPI takes the audio.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# The build number, which tells Windows 11 (rounded window corners) from Windows 10.
windows-version = "0.1.7"

# Geometry always comes from the X server (natively, or XWayland on a Wayland session): x11rb is
# pure Rust and the release Tauri's tao already links. A Wayland session takes its pixels through
# the portals with ashpd, on zbus's async-io flavour, which is the one Tauri's plugins use (the
# tokio flavour would switch theirs too, because features are unified). 0.12 is the line the
# portal code was written and run against.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["randr", "shm", "composite", "xfixes"] }
ashpd = { version = "0.12.3", default-features = false, features = ["async-std"] }
async-io = "2"
futures-lite = "2"
# System V shared memory for MIT-SHM grabs and `clock_gettime(CLOCK_MONOTONIC)`.
libc = "0.2"
# The sound server's sources and the portal's PipeWire node, read with the system's GStreamer
# (1.20 on Ubuntu 22.04), which the 0.24 bindings were run against.
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gstreamer-video = "0.24.5"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
