[package]
name = "glimpsfy"
description = "Screenshots, recordings, OCR and sharing from the menu bar"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's (cargo#8519 on Windows).
name = "glimpsfy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glimpsfy-capture.workspace = true
glimpsfy-record.workspace = true
glimpsfy-ocr.workspace = true
glimpsfy-upload.workspace = true
glimpsfy-history.workspace = true
glimpsfy-annotate.workspace = true
# Cut-by-text: speech to text on the machine and the speech model (`recording/transcript.rs`).
glimpsfy-speech.workspace = true
glimpsfy-models.workspace = true
glimpsfy-mcp.workspace = true

tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-single-instance = "2.5.2"
# The `glimpsfy://` scheme: macOS hands its URLs over as Apple Events, and an AppImage registers
# the scheme itself (`cli.rs`).
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The folder and file pickers of Settings and the pins (app shell).
tauri-plugin-dialog = "2.8.1"
# Glimpsfy's own updates from the GitHub releases (app shell, `update.rs`).
tauri-plugin-updater = { version = "2.13.1", default-features = false, features = ["native-tls"] }
# Reads the colour profile and resolution of a PNG the editor opens (annotation,
# `commands/render.rs`); the capture crate already builds it.
png.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSGeometry", "NSString", "NSValue", "NSURL", "NSLocale", "NSBundle", "NSFileManager", "NSError", "NSDistributedNotificationCenter", "NSNotification", "NSOperation", "block2"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes", "CFDictionary", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGWindow", "CGPath", "CGImage", "CGColorSpace", "CGContext", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "CGSession", "libc", "objc2", "bitflags"] }
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSPanel", "NSScreen", "NSView", "NSPasteboard", "NSPasteboardItem", "NSImage", "NSGraphics", "NSRunningApplication", "NSWorkspace", "NSEvent", "objc2-core-foundation", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSDragging", "NSDraggingItem", "NSDraggingSession", "block2", "libc", "NSVisualEffectView", "NSAppearance", "NSAnimation", "NSAnimationContext", "NSBezierPath", "NSColor", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
# Start at login writes its own launch agent on macOS (app shell, `commands/settings.rs`).
auto-launch = "0.6.0"
# Whether the app's own place can be replaced by an update without a password (`update.rs`).
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# The clipboard of Windows and Linux (app shell, `desktop/mod.rs`).
tauri-plugin-clipboard-manager = "2.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
# What the shell asks the X server itself (`desktop/linux.rs`): the pointer, the keys, the focus,
# window ids, the tray's XEmbed selection, the clicks and keys a recording shows, and the shape
# of a panel without a compositor; the release the capture crate uses.
x11rb = { version = "0.13.2", features = ["shape", "xinput"] }
# GTK and GDK as Tauri links them, for window types, override-redirect panels, the clipboard's
# files, dragging out and the display and compositor signals (`desktop/linux.rs`).
gtk = "0.18"
gdkx11 = "0.18"
# The GlobalShortcuts portal on Wayland, on zbus's async-io flavour as in the capture crate (the
# tokio flavour would switch every plugin's zbus to it).
ashpd = { version = "0.12.3", default-features = false, features = ["async-std"] }
futures-lite = "2"
# A JPEG chosen as a beautify background (`output/beautify.rs`); Windows lists it for the
# clipboard below.
zune-jpeg = "0.5.15"

[target.'cfg(target_os = "windows")'.dependencies]
# The Win32 calls the shell makes itself (`desktop/windows.rs`): the foreground window, the
# pointer and the keys, the capture exclusion, panels that stay out of Alt+Tab and show without
# the keyboard, the display and theme watch, a take's input hooks, files on the clipboard, the
# login item and the registry for the taskbar's theme.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Dragging a capture out goes through the shell's own data object and OLE, which are COM
# interfaces that windows-sys does not wrap (`desktop/windows.rs`); tao already builds 0.62.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell"] }
# Whether this Windows can keep a window out of captures (10 version 2004, build 19041).
windows-version = "0.1.7"
# A JPEG goes on the clipboard as pixels; the OCR crate already builds it (MIT, Apache-2.0 or
# Zlib).
zune-jpeg = "0.5.15"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
# PP-OCR, the text recognition of Linux and the second engine of Windows, with its runtime RTen
# built in (`crates/ocr`, feature `ppocr`). macOS reads with Vision and builds without it.
glimpsfy-ocr = { workspace = true, features = ["ppocr"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
