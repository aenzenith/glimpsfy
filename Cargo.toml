[workspace]
resolver = "2"
members = [
    "crates/capture",
    "crates/record",
    "crates/ocr",
    "crates/upload",
    "crates/history",
    "crates/annotate",
    "crates/mcp",
    "crates/models",
    "crates/speech",
    "src-tauri",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
authors = ["Mustafa Sarı"]
repository = "https://github.com/aenzenith/glimpsfy"
# RTen, the PP-OCR runtime on Windows and Linux, is the newest requirement (Tauri needs 1.90).
rust-version = "1.94"

[workspace.lints.clippy]
# With Rust 1.88 and newer, clippy would turn every `chunks_exact(4)` over pixels into `as_chunks`;
# the loops read the same either way and were measured as they are, so they stay.
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
glimpsfy-capture = { path = "crates/capture" }
glimpsfy-record = { path = "crates/record" }
glimpsfy-ocr = { path = "crates/ocr" }
glimpsfy-upload = { path = "crates/upload" }
glimpsfy-history = { path = "crates/history" }
glimpsfy-annotate = { path = "crates/annotate" }
glimpsfy-mcp = { path = "crates/mcp" }
glimpsfy-models = { path = "crates/models" }
glimpsfy-speech = { path = "crates/speech" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
png = "0.18"
tempfile = "3"

# macOS bindings. Every objc2 framework crate of the 0.3 line pairs with objc2 0.6, which is
# also what Tauri 2's tao and wry use, so one copy of the runtime is linked.
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The capture path copies and swizzles full-display frames: even a dev build runs it optimised,
# so the latency measured in `npm run tauri dev` is close to what a release build does.
[profile.dev.package.glimpsfy-capture]
opt-level = 3
# The Windows writer converts every frame to NV12 itself; unoptimised it takes 7 ms at 1080p and
# 28 ms at 4K, which drops frames in `npm run tauri dev` and in the pipeline tests on CI.
[profile.dev.package.glimpsfy-record]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
# The QR and barcode search outside macOS (`crates/ocr/src/barcodes.rs`) takes 406 ms for a
# full-HD screen unoptimised and 37 ms optimised.
[profile.dev.package.rxing]
opt-level = 3
# PP-OCR runs in Rust (`crates/ocr`, feature `ppocr`): unoptimised, a dev build reads a 1440 × 660
# screenshot in 29 s instead of 0.3 s and checks a model's hashes in a second. The runtime's own
# debug checks add a third to a dense screen's reading, so they are left out as well.
[profile.dev.package.glimpsfy-ocr]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-base]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-gemm]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-simd]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-tensor]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.rten-vecmath]
opt-level = 3
debug-assertions = false
overflow-checks = false
# Speech to text (`crates/speech`) resamples and measures the whole sound of a recording around
# whisper.cpp.
[profile.dev.package.glimpsfy-speech]
opt-level = 3
# whisper-rs-sys's build script compiles whisper.cpp with CMake. When the script itself is built
# with debug assertions it picks RelWithDebInfo (-O2 -g) and turns on WHISPER_DEBUG, which formats
# a trace line for every decoded token; without them it builds Release (-O3), as a release build
# does. On the CPU that reads 87 s of speech in 13.1 s instead of 14.9 s.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
debug-assertions = false
