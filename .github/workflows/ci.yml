# Checks every push and pull request on macOS, the first platform. The release workflow waits for
# this run (by its file name, ci.yml) before it merges a release PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    env:
      # As in release.yml: whisper.cpp is built for a baseline CPU, never for the runner's own.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel and adds rustfmt and clippy.
      - name: Rust toolchain
        run: rustup show active-toolchain

      # whisper.cpp (crates/speech) is built with CMake, and bindgen loads libclang for its Rust
      # bindings. The macOS and Windows images have both (LLVM in C:\Program Files\LLVM); Linux
      # gets them from packages.txt. The step fails early when an image drops one of them.
      - name: Speech build tools
        shell: bash
        run: |
          cmake --version
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
            test -f '/c/Program Files/LLVM/bin/libclang.dll'
          fi

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Type check
        run: npm run typecheck

      - name: Tests (TypeScript)
        run: npm test
