# Checks every push and pull request on macOS, Windows and Linux. The release workflow waits for
# this run (by its file name, ci.yml) before it merges a release PR, and it reads the conclusion
# of the whole run: a failure on any platform keeps the release PR open.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          # 22.04 is the oldest LTS that has webkit2gtk-4.1, and the release is built on it too:
          # what links against its glibc runs on newer distributions.
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      # As in release.yml: whisper.cpp is built for a baseline CPU, never for the runner's own.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v5

      # Tauri's prerequisites, GStreamer and what gives the tests a screen. The list is shared
      # with tools/linux-check, the same checks in Docker, so it is read here and never copied.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # The runner image carries LLVM's libunwind-14-dev, which conflicts with the libunwind-dev
          # that libgstreamer1.0-dev needs. As a mere dependency apt gives up on it ("held broken
          # packages"); asked for by name, it swaps the two. Docker's plain 22.04 has no conflict.
          sudo apt-get install -y --no-install-recommends libunwind-dev
          sed 's/#.*//' tools/linux-check/packages.txt | xargs sudo apt-get install -y --no-install-recommends

      # rust-toolchain.toml pins the channel and adds rustfmt and clippy.
      - name: Rust toolchain
        run: rustup show active-toolchain

      # whisper.cpp (crates/speech) is built with CMake, and bindgen loads libclang for its Rust
      # bindings. The macOS and Windows images have both (LLVM in C:\Program Files\LLVM); Linux
      # gets them from packages.txt. The step fails early when an image drops one of them.
      - name: Speech build tools
        shell: bash
        run: |
          cmake --version
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
            test -f '/c/Program Files/LLVM/bin/libclang.dll'
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      # rustfmt reads every module whatever platform it is compiled for, so one runner is enough.
      - name: cargo fmt
        if: runner.os == 'macOS'
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        if: runner.os != 'Linux'
        run: cargo test --workspace

      # The Linux capture tests need a screen. enter.sh gives them the session bus and the virtual
      # X display the Docker check runs in; --in-place keeps it on this checkout.
      - name: cargo test (Linux)
        if: runner.os == 'Linux'
        run: bash tools/linux-check/enter.sh --in-place cargo test --workspace

      - name: Type check
        run: npm run typecheck

      - name: Tests (TypeScript)
        run: npm test
