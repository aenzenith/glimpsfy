# Checks every push and pull request on macOS, the first platform. The release workflow waits for
# this run (by its file name, ci.yml) before it merges a release PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel and adds rustfmt and clippy.
      - name: Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Type check
        run: npm run typecheck

      - name: Tests (TypeScript)
        run: npm test
